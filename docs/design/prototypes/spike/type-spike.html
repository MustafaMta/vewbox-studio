<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type spike · Vewbox v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400..700&family=Noto+Serif+Display:wdth,wght@62.5..100,400..700&family=Amiri:wght@400;700&family=Markazi+Text:wght@400..700&family=Noto+Naskh+Arabic:wght@400..700&family=Noto+Kufi+Arabic:wght@300..800&family=Reem+Kufi:wght@400..700&family=Alexandria:wght@300..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Instrument+Sans:wdth,wght@75..100,400..700&family=El+Messiri:wght@400..700&family=Readex+Pro:wght@300..700&family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0a0a0a; color: #f2eee6; font-family: Geist, system-ui; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 1px solid #222; }
  .cell { position: relative; height: 300px; overflow: hidden; }
  .cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cell::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,8,8,.92) 0, rgba(8,8,8,.75) 40%, rgba(8,8,8,0) 75%); }
  .cell[dir=rtl]::after { background: linear-gradient(270deg, rgba(8,8,8,.92) 0, rgba(8,8,8,.75) 40%, rgba(8,8,8,0) 75%); }
  .txt { position: absolute; z-index: 2; inset-inline-start: 40px; bottom: 36px; max-width: 70%; }
  .tag { position: absolute; z-index: 2; top: 12px; inset-inline-start: 16px; font: 500 12px/16px 'Geist Mono'; color: #a49d92; }
  .meta { font: 400 13px/20px Geist, 'IBM Plex Sans Arabic'; color: #c9c2b6; margin-bottom: 10px; }
  .meta .m { font-family: 'Geist Mono'; font-size: 12px; }
  .title { font-size: 76px; line-height: 1; margin: 0; }
  [dir=rtl] .title { line-height: 1.35; }
  .lead { font: 400 15px/24px Geist, 'IBM Plex Sans Arabic'; color: #d8d2c7; margin-top: 12px; max-width: 46ch; }
</style>
</head>
<body>
<script>
const P = [
  ['A Instrument Serif 400 / Amiri 700', "'Instrument Serif'", 400, '-0.01em', "Amiri", 700, 'normal'],
  ['B Newsreader opsz72 500 / Markazi Text 600', "'Newsreader'", 500, '-0.02em', "'Markazi Text'", 600, 'normal'],
  ['C Noto Serif Display wdth 75 600 / Noto Naskh 700', "'Noto Serif Display'", 600, '-0.01em', "'Noto Naskh Arabic'", 700, '75%'],
  ['D Fraunces opsz144 500 / Amiri 400', "'Fraunces'", 500, '-0.02em', "Amiri", 400, 'normal'],
  ['E Instrument Sans wdth 75 600 / Noto Kufi Arabic 700', "'Instrument Sans'", 600, '-0.02em', "'Noto Kufi Arabic'", 700, '75%'],
  ['F Geist 600 / Alexandria 600', "'Geist'", 600, '-0.04em', "'Alexandria'", 600, 'normal'],
  ['G El Messiri 600 (both)', "'El Messiri'", 600, '-0.01em', "'El Messiri'", 600, 'normal'],
  ['H Newsreader opsz72 400 italic / Reem Kufi 600', "'Newsreader'", 400, '-0.02em', "'Reem Kufi'", 600, 'normal'],
];
for (const [name, lf, lw, tr, af, aw, wd] of P) {
  const row = document.createElement('div'); row.className = 'row';
  const italic = name.includes('italic') ? 'italic' : 'normal';
  row.innerHTML = `
  <div class="cell" dir="ltr"><img src="../media/plate-workshop-master.jpg"><div class="tag">${name}</div>
    <div class="txt"><div class="meta">Short · 2026 · <span class="m">0:56</span> · Cartoon · English · ● Finished</div>
    <h1 class="title" style="font-family:${lf};font-weight:${lw};letter-spacing:${tr};font-stretch:${wd};font-style:${italic};font-variation-settings:'opsz' 72">The Static Sky</h1>
    <div class="lead">A retired librarian and a lighthouse keeper repair a broken radio and hear a distress call from 1987.</div></div></div>
  <div class="cell" dir="rtl" lang="ar"><img src="../media/plate-workshop-bench.jpg"><div class="tag">${name}</div>
    <div class="txt"><div class="meta">مسلسل · 2026 · موسمان · كرتون · العربية (عراقية) · ● بانتظارك</div>
    <h1 class="title" style="font-family:${af};font-weight:${aw};font-size:64px">آخر رشفة في مقهى المتنبي</h1>
    <div class="lead">صاحب مقهى في بغداد يحتفظ بمذياع لا يبث إلا أخبار الغد.</div></div></div>`;
  document.body.append(row);
}
</script>
</body>
</html>
