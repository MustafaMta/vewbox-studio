name: vewbox

x-dns: &dns
  - 1.1.1.1
  - 8.8.8.8

# Structured JSON logs with rotation on every service (one line per event; secrets are redacted at the source).
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

# THE MODEL STORE (docs/MODELS-STORAGE.md). Every weight lives in ONE ext4 VHDX on D: (VEWBOX_MODELS_VHDX, default
# D:\models\vewbox-models.vhdx), attached to the WSL VM without admin rights: `wsl --mount --vhd <vhdx> --name models`
# (scripts/resume-local.mjs and scripts/docker-watchdog.ts attach it). Docker's engine sees it at
# /run/desktop/mnt/host/wsl/models — VEWBOX_MODELS_ROOT — NOT at /mnt/wsl/models (that path silently becomes an empty
# directory on Docker Desktop's own disk). The `models` and `ollama` volumes below are binds of that root: every
# service mounts `models:/models`, read-only unless it writes, plus read-write sub-folders where it must (the caches,
# a service's own download folder). Not attached = the volume cannot be mounted and the service does not start, so
# nothing ever runs without its weights. Weights are never baked into images.
x-model-cache-env: &model-cache-env
  # Hugging Face / Transformers / Torch caches inside the store (never in a container layer on C:)
  HF_HOME: /models/cache/hf
  HF_HUB_CACHE: /models/cache/hf/hub
  TRANSFORMERS_CACHE: /models/cache/hf/hub
  TORCH_HOME: /models/cache/torch
x-cache-hf-rw: &cache-hf-rw { type: volume, source: models, target: /models/cache/hf, volume: { subpath: cache/hf } }
x-cache-torch-rw: &cache-torch-rw { type: volume, source: models, target: /models/cache/torch, volume: { subpath: cache/torch } }

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgres://vewbox:${POSTGRES_PASSWORD:-change-me-please}@db:5432/vewbox}
  STUDIO_PASSWORD: ${STUDIO_PASSWORD:-}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io}
  MINIMAX_VIDEO_MODEL: ${MINIMAX_VIDEO_MODEL:-MiniMax-H3}
  MINIMAX_VIDEO_RESOLUTION: ${MINIMAX_VIDEO_RESOLUTION:-768P}
  MINIMAX_TEXT_MODEL: ${MINIMAX_TEXT_MODEL:-MiniMax-M3}
  MINIMAX_SPEECH_MODEL: ${MINIMAX_SPEECH_MODEL:-speech-2.8-hd}
  MINIMAX_MUSIC_MODEL: ${MINIMAX_MUSIC_MODEL:-music-3.0}
  VIDEO_BACKEND: ${VIDEO_BACKEND:-auto}
  MUSIC_ENGINE: ${MUSIC_ENGINE:-auto}
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://llm:11434/v1}
  OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-ollama}
  # the local story model: Qwen3.6-27B Q8_0 since 2026-10-06 (docs/research/MODEL-EVAL-2026-10.md §9); gemma4:31b-it-qat is the fallback
  OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-qwen3.6:27b-q8_0}
  # what the app asks the local Ollama for per request (num_ctx, keep_alive); the llm service gets the same values
  OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
  COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
  TTS_URL: ${TTS_URL:-http://tts:8020}
  TTS_HABIBI_URL: ${TTS_HABIBI_URL:-http://tts-habibi:8021}
  TTS_DESIGN_URL: ${TTS_DESIGN_URL:-http://tts-design:8022}
  # the English voice engine for NEW voices (src/server/providers/voice-engines.ts): MOSS-TTS v1.5 since 2026-10-06
  # (docs/research/VOICE-BENCH-2026-10.md §3.2); the tts-moss service runs under profile `moss`
  # (`docker compose --profile moss up -d tts-moss`); VOICE_ENGINE_EN=indextts returns to the old route
  VOICE_ENGINE_EN: ${VOICE_ENGINE_EN:-moss}
  TTS_MOSS_URL: ${TTS_MOSS_URL:-http://tts-moss:8023}
  ASR_URL: ${ASR_URL:-http://asr:8030}
  LIPSYNC_URL: ${LIPSYNC_URL:-http://lipsync:8040}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: ${LOG_PRETTY:-0}
  CODE_VERSION: ${CODE_VERSION:-dev}

services:
  db:
    logging: *logging
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vewbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: ${POSTGRES_DB:-vewbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # loopback only: lets `pnpm dev` / tests on this machine reach the database
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vewbox} -d ${POSTGRES_DB:-vewbox}"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  web:
    logging: *logging
    dns: *dns
    init: true
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { CODE_VERSION: "${CODE_VERSION:-dev}" }
    image: vewbox/web:${CODE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *app-env
      LIBRARY_ROOT: /data/library
      PUBLIC_ROOT: /app/public
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      # the address the port is published on: a LAN address needs STUDIO_PASSWORD (src/instrumentation.ts refuses otherwise)
      STUDIO_BIND: ${WEB_BIND:-127.0.0.1}
      STUDIO_ALLOW_OPEN_LAN: ${STUDIO_ALLOW_OPEN_LAN:-}
    volumes:
      - ${LIBRARY_DIR:-./var/library}:/data/library
    ports:
      # loopback by default; WEB_BIND=0.0.0.0 (with STUDIO_PASSWORD) publishes it to the LAN
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4200/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    stop_grace_period: 20s

  worker:
    logging: *logging
    dns: *dns
    init: true
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args: { CODE_VERSION: "${CODE_VERSION:-dev}" }
    image: vewbox/worker:${CODE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_healthy }
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      LIBRARY_ROOT: /data/library
      PUBLIC_ROOT: /app/public
      TMP_ROOT: /data/tmp
      WORKER_CONCURRENCY_HOSTED: ${WORKER_CONCURRENCY_HOSTED:-4}
      WORKER_CONCURRENCY_LLM: ${WORKER_CONCURRENCY_LLM:-2}
      WORKER_CONCURRENCY_CPU: ${WORKER_CONCURRENCY_CPU:-2}
      GPU_VRAM_BUDGET_MB: ${GPU_VRAM_BUDGET_MB:-30000}
    volumes:
      - ${LIBRARY_DIR:-./var/library}:/data/library
      - workertmp:/data/tmp
    stop_grace_period: 40s

  comfyui:
    logging: *logging
    build: { context: ., dockerfile: docker/comfyui/Dockerfile }
    dns: *dns
    image: vewbox/comfyui:${CODE_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *model-cache-env
      COMFY_RESERVE_VRAM: ${COMFY_RESERVE_VRAM:-1.0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      # the store read-only (its typed tree is /models/comfyui: extra_model_paths.yaml); only the HF cache is writable
      - models:/models:ro
      - *cache-hf-rw
      - comfyout:/opt/comfyui/output
      - comfyin:/opt/comfyui/input
      - ${LIBRARY_DIR:-./var/library}:/data/library:ro
      # mounted from the repo (like the voice services' scripts) so a new model folder needs a restart, not a rebuild
      - ./docker/comfyui/extra_model_paths.yaml:/opt/comfyui/extra_model_paths.yaml:ro
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "8gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8188/system_stats"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 10
    stop_grace_period: 30s

  # Voices: IndexTTS 2.5 (EN/AR) and Habibi-TTS IRQ (Iraqi Arabic); transcription: faster-whisper large-v3.
  tts:
    logging: *logging
    build: { context: ., dockerfile: docker/tts/Dockerfile, target: indextts }
    image: vewbox/tts-indextts:${CODE_VERSION:-dev}
    restart: unless-stopped
    dns: *dns
    # HF_HOME in the store (cache/hf): auxiliary downloads (vocoders, tokenizers) survive a container recreate
    environment: { <<: *model-cache-env, NVIDIA_VISIBLE_DEVICES: all, HF_TOKEN: "${HF_TOKEN:-}" }
    # the entrypoint and the small service app are mounted from the repo so a fix to either takes effect on restart
    # without rebuilding the 12 GB images (the images still carry copies for a run without the repo). The store is
    # read-only; tts/ stays writable because the entrypoint downloads missing voice weights there on a fresh machine.
    volumes: [ "models:/models:ro", { type: volume, source: models, target: /models/tts, volume: { subpath: tts } }, *cache-hf-rw, "./docker/tts/entrypoint.sh:/opt/entrypoint.sh:ro", "./docker/tts/app.py:/opt/index-tts/vewbox_app.py:ro" ]
    ports: [ "127.0.0.1:${TTS_PORT:-8020}:8020" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8020/health"], interval: 30s, timeout: 10s, start_period: 600s, retries: 20 }
    stop_grace_period: 30s

  tts-habibi:
    logging: *logging
    build: { context: ., dockerfile: docker/tts/Dockerfile, target: habibi }
    image: vewbox/tts-habibi:${CODE_VERSION:-dev}
    restart: unless-stopped
    dns: *dns
    environment: { <<: *model-cache-env, NVIDIA_VISIBLE_DEVICES: all, HF_TOKEN: "${HF_TOKEN:-}" }
    volumes: [ "models:/models:ro", { type: volume, source: models, target: /models/tts, volume: { subpath: tts } }, *cache-hf-rw, "./docker/tts/entrypoint.sh:/opt/entrypoint.sh:ro", "./docker/tts/app.py:/opt/habibi/vewbox_app.py:ro" ]
    ports: [ "127.0.0.1:${TTS_HABIBI_PORT:-8021}:8021" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8021/health"], interval: 30s, timeout: 10s, start_period: 600s, retries: 20 }
    stop_grace_period: 30s

  # Voice design (VoxCPM2: a synthetic voice from a text description, EN/MSA) and ECAPA speaker embeddings. Built on
  # the tts-habibi image (same CUDA/torch venv), so build tts-habibi first on a fresh machine. Weights: fetcher group
  # `voice-design` (docs/MODELS.md); the service never downloads. Never loaded it holds no VRAM; loaded ≈ 7 GB of the
  # card (measured); after /unload its CUDA context (≈ 0.6 GB) stays until a restart.
  tts-design:
    logging: *logging
    build: { context: ., dockerfile: docker/tts-design/Dockerfile, args: { BASE_IMAGE: "vewbox/tts-habibi:${CODE_VERSION:-dev}" } }
    image: vewbox/tts-design:${CODE_VERSION:-dev}
    restart: unless-stopped
    environment: { <<: *model-cache-env, NVIDIA_VISIBLE_DEVICES: all, ECAPA_DEVICE: "${TTS_DESIGN_ECAPA_DEVICE:-cpu}" }
    volumes: [ "models:/models:ro", *cache-hf-rw, "./docker/tts/app.py:/opt/voxcpm/vewbox_tts_shared.py:ro", "./docker/tts-design/app.py:/opt/voxcpm/vewbox_design_app.py:ro" ]
    ports: [ "127.0.0.1:${TTS_DESIGN_PORT:-8022}:8022" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8022/health"], interval: 30s, timeout: 10s, start_period: 60s, retries: 10 }
    stop_grace_period: 30s

  # Voice BENCH engines (docs/research/VOICE-BENCH-2026-10.md): candidate cloning engines behind the /synthesize contract,
  # profile `bench` only — never started by `up`, never used by the app. Start one at a time, under scripts/gpu-hold.ts:
  # `docker compose --profile bench up -d --no-deps tts-bench-voxcpm2`. Models volume read-only; nothing downloads.
  tts-bench-voxcpm2:
    logging: *logging
    image: vewbox/tts-design:${CODE_VERSION:-dev}
    profiles: ["bench"]
    environment: { NVIDIA_VISIBLE_DEVICES: all, BENCH_ENGINE: voxcpm2, MODEL_ROOT: /models, HF_HUB_OFFLINE: "1", TRANSFORMERS_OFFLINE: "1", TQDM_DISABLE: "1" }
    volumes: [ "models:/models:ro", "./docker/tts/app.py:/opt/bench/vewbox_tts_shared.py:ro", "./docker/tts-bench/app.py:/opt/bench/vewbox_bench_app.py:ro" ]
    working_dir: /opt/bench
    entrypoint: []
    command: ["/opt/habibi/.venv/bin/python", "-m", "uvicorn", "vewbox_bench_app:app", "--host", "0.0.0.0", "--port", "8040", "--workers", "1"]
    ports: [ "127.0.0.1:${TTS_BENCH_VOXCPM2_PORT:-8040}:8040" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8040/health"], interval: 30s, timeout: 10s, start_period: 60s, retries: 10 }

  tts-bench-dots:
    logging: *logging
    build: { context: ., dockerfile: docker/tts-bench/Dockerfile, target: dots, args: { DESIGN_IMAGE: "vewbox/tts-design:${CODE_VERSION:-dev}" }, secrets: [extra_ca] }
    image: vewbox/tts-bench-dots:${CODE_VERSION:-dev}
    profiles: ["bench"]
    dns: *dns
    environment: { NVIDIA_VISIBLE_DEVICES: all }
    volumes: [ "models:/models:ro", "./docker/tts/app.py:/opt/bench/vewbox_tts_shared.py:ro", "./docker/tts-bench/app.py:/opt/bench/vewbox_bench_app.py:ro" ]
    ports: [ "127.0.0.1:${TTS_BENCH_DOTS_PORT:-8041}:8041" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8041/health"], interval: 30s, timeout: 10s, start_period: 60s, retries: 10 }

  # MOSS-TTS v1.5 (OpenMOSS, 8 B, Apache-2.0): the primary English production voice candidate (PRODUCTION-STACK-DIRECTIVE
  # 2026-10-06), the same /synthesize contract as `tts`, one reference clip per identity, token-level duration control.
  # Profile `moss` until the real-UI proof promotes it; then VOICE_ENGINE_EN=moss selects it for NEW English voices
  # (pinned voices keep their engine). Weights from the store (group eval-voice-moss, 22.4 GB; tts/bench/moss-*).
  # Measured on the bench: ≈ 20 GB of the card loaded (bf16, SDPA); unload before any other family.
  tts-moss:
    logging: *logging
    build: { context: ., dockerfile: docker/tts-bench/Dockerfile, target: moss, secrets: [extra_ca] }
    image: vewbox/tts-moss:${CODE_VERSION:-dev}
    profiles: ["moss"]
    restart: unless-stopped
    dns: *dns
    environment: { NVIDIA_VISIBLE_DEVICES: all, BENCH_ENGINE: moss }
    volumes: [ "models:/models:ro", "./docker/tts/app.py:/opt/bench/vewbox_tts_shared.py:ro", "./docker/tts-bench/app.py:/opt/bench/vewbox_bench_app.py:ro" ]
    command: ["python", "-m", "uvicorn", "vewbox_bench_app:app", "--host", "0.0.0.0", "--port", "8023", "--workers", "1"]
    ports: [ "127.0.0.1:${TTS_MOSS_PORT:-8023}:8023" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8023/health"], interval: 30s, timeout: 10s, start_period: 120s, retries: 10 }
    stop_grace_period: 30s

  # the bench's MOSS arm: the same image (built by tts-moss) on the bench port
  tts-bench-moss:
    logging: *logging
    image: vewbox/tts-moss:${CODE_VERSION:-dev}
    profiles: ["bench"]
    dns: *dns
    environment: { NVIDIA_VISIBLE_DEVICES: all }
    volumes: [ "models:/models:ro", "./docker/tts/app.py:/opt/bench/vewbox_tts_shared.py:ro", "./docker/tts-bench/app.py:/opt/bench/vewbox_bench_app.py:ro" ]
    ports: [ "127.0.0.1:${TTS_BENCH_MOSS_PORT:-8042}:8042" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8042/health"], interval: 30s, timeout: 10s, start_period: 120s, retries: 10 }

  # Transcription: faster-whisper large-v3 (every language) and, for `language=ar`, the Arabic-dialect fine-tune
  # (ASR_MODEL_DIR_AR, CTranslate2 fp16 written by the asr-convert one-off). One Whisper model on the card at a time:
  # the service drops the other before loading (docker/asr/app.py). Until the ct2 folder exists, `ar` uses large-v3.
  asr:
    logging: *logging
    build: { context: ., dockerfile: docker/asr/Dockerfile, secrets: [extra_ca] }
    image: vewbox/asr:${CODE_VERSION:-dev}
    restart: unless-stopped
    dns: *dns
    # the store read-only; writable: qa/ (qa.py fetches the pinned Face Landmarker there once) and the caches (Demucs's
    # htdemucs checkpoint under TORCH_HOME = cache/torch)
    environment: { <<: *model-cache-env, NVIDIA_VISIBLE_DEVICES: all, ASR_MODEL_DIR_AR: "${ASR_MODEL_DIR_AR:-/models/asr/whisper-large-v3-arabic-dialectal-v2-ct2}" }
    volumes: [ "models:/models:ro", { type: volume, source: models, target: /models/qa, volume: { subpath: qa } }, *cache-hf-rw, *cache-torch-rw, "nvjit:/cache/nv-jit", "./docker/asr/app.py:/app/app.py:ro", "./docker/asr/align.py:/app/align.py:ro", "./docker/asr/qa.py:/app/qa.py:ro" ]
    ports: [ "127.0.0.1:${ASR_PORT:-8030}:8030" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8030/health"], interval: 20s, timeout: 10s, start_period: 60s, retries: 10 }

  # Lip-sync corrector (docker/lipsync): LatentSync 1.6 with a YuNet + MediaPipe face tracker (no InsightFace). Redraws
  # the mouth of an EXISTING take, only for a take flagged and confirmed for correction; never generates video. Weights:
  # manifest groups lipsync-latentsync-1.6 + qa-identity, and the Face Landmarker the asr service keeps under /models/qa.
  # GPU family LIPSYNC (src/server/gpu/lease.ts): ComfyUI and the other engines unload before it loads (≈ 18 GB per the
  # upstream README; measured figure in docs/MODELS.md). LIPSYNC_KEEP_LOADED=0 drops the weights after every request.
  lipsync:
    logging: *logging
    build: { context: ., dockerfile: docker/lipsync/Dockerfile, secrets: [extra_ca] }
    image: vewbox/lipsync:${CODE_VERSION:-dev}
    # opt-in: `docker compose --profile lipsync up -d lipsync` (a plain `up` neither builds nor starts it). Idle it holds
    # no VRAM: torch and the weights load on the first request.
    profiles: ["lipsync"]
    restart: unless-stopped
    dns: *dns
    # the caches point into the store like every service's (the image's TORCH_HOME lines are docker/asr's, kept verbatim
    # for layer reuse); the service is offline and the store read-only here
    environment: { <<: *model-cache-env, NVIDIA_VISIBLE_DEVICES: all, LIPSYNC_KEEP_LOADED: "${LIPSYNC_KEEP_LOADED:-0}" }
    volumes: [ "models:/models:ro", "nvjit:/cache/nv-jit", "./docker/lipsync/app.py:/app/app.py:ro", "./docker/lipsync/corrector.py:/app/corrector.py:ro", "./docker/lipsync/face_track.py:/app/face_track.py:ro", "./docker/lipsync/cli.py:/app/cli.py:ro", "./docker/lipsync/eval_batch.py:/app/eval_batch.py:ro" ]
    ports: [ "127.0.0.1:${LIPSYNC_PORT:-8040}:8040" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    shm_size: "4gb"
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8040/health"], interval: 30s, timeout: 10s, start_period: 60s, retries: 10 }
    stop_grace_period: 30s

  # One-shot: convert the transformers-format Iraqi Whisper (manifest group stack-2026-10, fetched first) to CTranslate2
  # fp16 for the asr service. `docker compose --profile models run --rm asr-convert`. CPU only (no GPU reservation):
  # loads the 6.17 GB fp32 checkpoint into RAM and writes about 3.1 GB. The fine-tune ships no preprocessor_config.json;
  # large-v3's (128 mel bins) is copied in, otherwise faster-whisper would default to 80 bins. Idempotent: skips when
  # model.bin exists. Nothing in the image changes: transformers is installed into the throwaway container only.
  asr-convert:
    logging: *logging
    image: vewbox/asr:${CODE_VERSION:-dev}
    dns: *dns
    profiles: ["models"]
    environment:
      ASR_HF_DIR: ${ASR_HF_DIR_AR:-/models/asr/whisper-large-v3-arabic-dialectal-v2-hf}
      ASR_CT2_DIR: ${ASR_MODEL_DIR_AR:-/models/asr/whisper-large-v3-arabic-dialectal-v2-ct2}
      ASR_BASE_DIR: ${ASR_MODEL_DIR:-/models/asr/faster-whisper-large-v3}
    # read-only store, writable asr/ (the converted copy is written there)
    volumes: [ "models:/models:ro", { type: volume, source: models, target: /models/asr, volume: { subpath: asr } } ]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f "$$ASR_CT2_DIR/model.bin" ]; then echo "already converted: $$ASR_CT2_DIR"; exit 0; fi
        test -f "$$ASR_HF_DIR/model.safetensors" || { echo "fetch group stack-2026-10 first (no $$ASR_HF_DIR/model.safetensors)"; exit 2; }
        pip install --no-cache-dir "transformers==4.57.1"
        # the fine-tune's tokenizer_config.json was written by transformers 5.x (extra_special_tokens as a LIST), which
        # 4.x refuses ("'list' object has no attribute 'keys'", 2026-10-05): convert from a temporary copy whose config
        # drops that key (tokenizer.json already carries the tokens); the weights are linked, not copied
        TMP=/tmp/asr-hf; rm -rf "$$TMP"; mkdir -p "$$TMP"
        for f in config.json generation_config.json tokenizer.json processor_config.json; do cp "$$ASR_HF_DIR/$$f" "$$TMP/"; done
        ln -s "$$ASR_HF_DIR/model.safetensors" "$$TMP/model.safetensors"
        python3 -c "import json; t=json.load(open('$$ASR_HF_DIR/tokenizer_config.json')); t.pop('extra_special_tokens', None); json.dump(t, open('$$TMP/tokenizer_config.json','w'))"
        ct2-transformers-converter --model "$$TMP" --output_dir "$$ASR_CT2_DIR.partial" --quantization float16 --copy_files tokenizer.json --force
        cp "$$ASR_BASE_DIR/preprocessor_config.json" "$$ASR_CT2_DIR.partial/"
        rm -rf "$$ASR_CT2_DIR" && mv "$$ASR_CT2_DIR.partial" "$$ASR_CT2_DIR"
        ls -la "$$ASR_CT2_DIR" && du -sh "$$ASR_CT2_DIR"

  # Local story engine (OpenAI-compatible) so writing works without a hosted key. Weights are pulled once into the volume
  # (llm-pull). Models available: qwen3.6:27b-q8_0 (the production model since 2026-10-06; 28.4 GB loaded at 16K, 66/66
  # layers, card ≈ 31.5 GB of 32.6 — the whole card; docs/research/MODEL-EVAL-2026-10.md §9), gemma4:31b-it-qat (the
  # emergency fallback; 19.1 GB loaded, card 21.4 GB, §3) and qwen3:14b (preview; 10.6 GB, card 11.5 GB);
  # OPENAI_COMPATIBLE_MODEL chooses. Flash attention with a q8_0 KV cache halves the cache; OLLAMA_CONTEXT_LENGTH is the
  # server default and what the app sends as num_ctx. Ollama offloads layers to the CPU when a model and its cache
  # exceed the card.
  llm:
    logging: *logging
    image: ollama/ollama:0.35.1
    dns: *dns
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      NVIDIA_VISIBLE_DEVICES: all
      # Ollama (Go) trusts the system bundle plus every PEM file in these directories: the extra root (EXTRA_CA_FILE,
      # secret extra_ca, empty by default) lets `ollama pull` through an antivirus that re-signs HTTPS; empty = no-op
      SSL_CERT_DIR: /etc/ssl/certs:/run/secrets
      # the weights: <store>/llm/ollama/models (the `ollama` volume is <store>/llm/ollama, mounted as /root/.ollama)
      OLLAMA_MODELS: /root/.ollama/models
    secrets: [extra_ca]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # One-shot: pull the story/vision models into the ollama volume (Ollama's own registry, not the fetcher; resumable).
  # `docker compose --profile models run --rm llm-pull`. Runs its own short-lived server on the CPU (a pull loads nothing
  # on the card), so the `llm` service need not be up; with `llm` up, `docker compose exec llm ollama pull <tag>` is the same.
  llm-pull:
    logging: *logging
    image: ollama/ollama:0.35.1
    dns: *dns
    profiles: ["models"]
    environment:
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-qwen3.6:27b-q8_0,gemma4:31b-it-qat}
      OLLAMA_HOST: 127.0.0.1:11435
      SSL_CERT_DIR: /etc/ssl/certs:/run/secrets # the extra root, as for `llm`
      OLLAMA_MODELS: /root/.ollama/models
    secrets: [extra_ca]
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/tmp/serve.log 2>&1 &
        for i in $$(seq 1 60); do ollama list >/dev/null 2>&1 && break; sleep 1; done
        rc=0
        for m in $$(echo "$$OLLAMA_PULL_MODELS" | tr ',' ' '); do echo "pull $$m"; ollama pull "$$m" || rc=1; done
        ollama list
        exit $$rc

  # One-shot: fetch pinned model weights into the shared volume (resumable, verified). `docker compose --profile models run --rm models`
  # MODEL_GROUPS is read from .env / the shell when compose parses this file, NOT from `run -e`: to fetch one group, pass the
  # arguments instead: `docker compose --profile models run --rm models --manifest manifest.json --root /models --groups stack-2026-10`
  models:
    logging: *logging
    build: { context: ., dockerfile: docker/models/Dockerfile, secrets: [extra_ca] }
    dns: *dns
    image: vewbox/models:${CODE_VERSION:-dev}
    profiles: ["models"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # plain HTTPS range downloads (resumable) rather than xet chunking, which stalled on this network
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      # refuse a root without the store's .vewbox-models marker (docs/MODELS-STORAGE.md)
      MODELS_REQUIRE_MARKER: "1"
      HF_HOME: /models/cache/hf
    volumes:
      - models:/models
      # the fetcher, the manifest and the layout from the repo: a manifest or layout change needs no image rebuild
      - ./docker/models/fetch.py:/app/fetch.py:ro
      - ./docker/models/manifest.json:/app/manifest.json:ro
      - ./docker/models/layout.json:/app/layout.json:ro
    command: ["--manifest", "manifest.json", "--root", "/models", "--groups", "${MODEL_GROUPS:-video-minimax-h3,images-qwen,asr-whisper,music-ace-step,video-minimax-h3-reference,music-minimax-3,voice-design}"]

# An extra public root certificate the asr and models builds (and the llm / llm-pull containers, at run time) trust,
# for a network that inspects TLS (an antivirus's HTTPS scanning re-signs pypi.org, huggingface.co and the Ollama
# registry with its own root). EXTRA_CA_FILE in .env points at it (kept outside Git, e.g. var/certs/extra-ca.pem);
# unset, an empty file is passed and nothing changes.
secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-./docker/certs/none.pem}

volumes:
  pgdata:
  workertmp:
  # the model store (see the top of this file): binds of VEWBOX_MODELS_ROOT, under names of their own, so the old
  # vewbox_models / vewbox_ollama volumes are never reused or "recreated" by compose (model-paths: allow). Removing these volumes (even
  # `down -v`) removes only Docker's record of the bind, never the store's files (verified 2026-10-06).
  models:
    name: vewbox_models_store
    driver: local
    driver_opts: { type: none, o: bind, device: "${VEWBOX_MODELS_ROOT:-/run/desktop/mnt/host/wsl/models}" }
  comfyout:
  comfyin:
  ollama:
    name: vewbox_ollama_store
    driver: local
    driver_opts: { type: none, o: bind, device: "${VEWBOX_MODELS_ROOT:-/run/desktop/mnt/host/wsl/models}/llm/ollama" }
  nvjit:
