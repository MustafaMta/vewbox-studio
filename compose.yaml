name: vewbox

x-dns: &dns
  - 1.1.1.1
  - 8.8.8.8

# Structured JSON logs with rotation on every service (one line per event; secrets are redacted at the source).
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgres://vewbox:${POSTGRES_PASSWORD:-change-me-please}@db:5432/vewbox}
  STUDIO_PASSWORD: ${STUDIO_PASSWORD:-}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io}
  MINIMAX_VIDEO_MODEL: ${MINIMAX_VIDEO_MODEL:-MiniMax-H3}
  MINIMAX_VIDEO_RESOLUTION: ${MINIMAX_VIDEO_RESOLUTION:-768P}
  MINIMAX_TEXT_MODEL: ${MINIMAX_TEXT_MODEL:-MiniMax-M3}
  MINIMAX_SPEECH_MODEL: ${MINIMAX_SPEECH_MODEL:-speech-2.8-hd}
  MINIMAX_MUSIC_MODEL: ${MINIMAX_MUSIC_MODEL:-music-3.0}
  VIDEO_BACKEND: ${VIDEO_BACKEND:-auto}
  MUSIC_ENGINE: ${MUSIC_ENGINE:-auto}
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://llm:11434/v1}
  OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-ollama}
  OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-qwen3:14b}
  COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
  TTS_URL: ${TTS_URL:-http://tts:8020}
  TTS_HABIBI_URL: ${TTS_HABIBI_URL:-http://tts-habibi:8021}
  ASR_URL: ${ASR_URL:-http://asr:8030}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: ${LOG_PRETTY:-0}
  CODE_VERSION: ${CODE_VERSION:-dev}

services:
  db:
    logging: *logging
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vewbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: ${POSTGRES_DB:-vewbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # loopback only: lets `pnpm dev` / tests on this machine reach the database
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vewbox} -d ${POSTGRES_DB:-vewbox}"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  web:
    logging: *logging
    dns: *dns
    init: true
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { CODE_VERSION: "${CODE_VERSION:-dev}" }
    image: vewbox/web:${CODE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *app-env
      LIBRARY_ROOT: /data/library
      PUBLIC_ROOT: /app/public
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
    volumes:
      - ${LIBRARY_DIR:-./var/library}:/data/library
    ports:
      - "${WEB_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4200/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    stop_grace_period: 20s

  worker:
    logging: *logging
    dns: *dns
    init: true
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args: { CODE_VERSION: "${CODE_VERSION:-dev}" }
    image: vewbox/worker:${CODE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_healthy }
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      LIBRARY_ROOT: /data/library
      PUBLIC_ROOT: /app/public
      TMP_ROOT: /data/tmp
      WORKER_CONCURRENCY_HOSTED: ${WORKER_CONCURRENCY_HOSTED:-4}
      WORKER_CONCURRENCY_LLM: ${WORKER_CONCURRENCY_LLM:-2}
      WORKER_CONCURRENCY_CPU: ${WORKER_CONCURRENCY_CPU:-2}
      GPU_VRAM_BUDGET_MB: ${GPU_VRAM_BUDGET_MB:-30000}
    volumes:
      - ${LIBRARY_DIR:-./var/library}:/data/library
      - workertmp:/data/tmp
    stop_grace_period: 40s

  comfyui:
    logging: *logging
    build: { context: ., dockerfile: docker/comfyui/Dockerfile }
    dns: *dns
    image: vewbox/comfyui:${CODE_VERSION:-dev}
    restart: unless-stopped
    environment:
      COMFY_RESERVE_VRAM: ${COMFY_RESERVE_VRAM:-1.0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - models:/models
      - comfyout:/opt/comfyui/output
      - comfyin:/opt/comfyui/input
      - ${LIBRARY_DIR:-./var/library}:/data/library:ro
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "8gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8188/system_stats"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 10
    stop_grace_period: 30s

  # Voices: IndexTTS 2.5 (EN/AR) and Habibi-TTS IRQ (Iraqi Arabic); transcription: faster-whisper large-v3.
  tts:
    logging: *logging
    build: { context: ., dockerfile: docker/tts/Dockerfile, target: indextts }
    image: vewbox/tts-indextts:${CODE_VERSION:-dev}
    restart: unless-stopped
    dns: *dns
    environment: { NVIDIA_VISIBLE_DEVICES: all, HF_TOKEN: "${HF_TOKEN:-}" }
    # the entrypoint is mounted from the repo so a fix to it takes effect on restart without rebuilding the 12 GB image
    volumes: [ "models:/models", "./docker/tts/entrypoint.sh:/opt/entrypoint.sh:ro" ]
    ports: [ "127.0.0.1:${TTS_PORT:-8020}:8020" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8020/health"], interval: 30s, timeout: 10s, start_period: 600s, retries: 20 }
    stop_grace_period: 30s

  tts-habibi:
    logging: *logging
    build: { context: ., dockerfile: docker/tts/Dockerfile, target: habibi }
    image: vewbox/tts-habibi:${CODE_VERSION:-dev}
    restart: unless-stopped
    dns: *dns
    environment: { NVIDIA_VISIBLE_DEVICES: all, HF_TOKEN: "${HF_TOKEN:-}" }
    volumes: [ "models:/models", "./docker/tts/entrypoint.sh:/opt/entrypoint.sh:ro" ]
    ports: [ "127.0.0.1:${TTS_HABIBI_PORT:-8021}:8021" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8021/health"], interval: 30s, timeout: 10s, start_period: 600s, retries: 20 }
    stop_grace_period: 30s

  asr:
    logging: *logging
    build: { context: ., dockerfile: docker/asr/Dockerfile }
    image: vewbox/asr:${CODE_VERSION:-dev}
    restart: unless-stopped
    dns: *dns
    environment: { NVIDIA_VISIBLE_DEVICES: all }
    volumes: [ "models:/models", "nvjit:/cache/nv-jit" ]
    ports: [ "127.0.0.1:${ASR_PORT:-8030}:8030" ]
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8030/health"], interval: 20s, timeout: 10s, start_period: 60s, retries: 10 }

  # Local story engine (OpenAI-compatible) so writing works without a hosted key. Weights are pulled once into the volume.
  llm:
    logging: *logging
    image: ollama/ollama:0.12.3
    dns: *dns
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # One-shot: fetch pinned model weights into the shared volume (resumable, verified). `docker compose --profile models run --rm models`
  models:
    logging: *logging
    build: { context: ., dockerfile: docker/models/Dockerfile }
    dns: *dns
    image: vewbox/models:${CODE_VERSION:-dev}
    profiles: ["models"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # plain HTTPS range downloads (resumable) rather than xet chunking, which stalled on this network
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
    volumes:
      - models:/models
    command: ["--manifest", "manifest.json", "--root", "/models", "--groups", "${MODEL_GROUPS:-video-minimax-h3,images-qwen,asr-whisper,music-ace-step,video-minimax-h3-reference,music-minimax-3}"]

volumes:
  pgdata:
  workertmp:
  models:
  comfyout:
  comfyin:
  ollama:
  nvjit:
